<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#170f2b;color:#fdf2f7;font:16px/1.6 system-ui,sans-serif;text-align:center}a{color:#f6b8cf}</style>
</head>
<body>
<p>Oops, this page doesn't exist.<br><a id="home" href="/">Open the surprise 🎁</a></p>
<script>
// On a project site (name.github.io/repo/…) the home page is the first folder, not the root.
var seg = location.pathname.split('/')[1];
if (/\.github\.io$/.test(location.hostname) && seg) document.getElementById('home').href = '/' + seg + '/';
</script>
</body>
</html>
